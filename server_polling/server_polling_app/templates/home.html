{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celery Task Runner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .task-group {
            margin-bottom: 20px;
        }

        .task-group label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        .task-group input[type="number"],
        .task-group input[type="text"],
        .task-group button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .task-group button {
            background-color: #28a745;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .task-group button:hover {
            background-color: #218838;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9ecef;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Celery Task Runner</h1>
        <div class="task-group">
            <label for="delay">Run Print Message Task</label>
            <input type="number" id="delay" placeholder="Enter delay in seconds (default: 5)">
            <button onclick="runPrintMessageTask()">Run Print Message Task</button>
        </div>
        <div class="task-group">
            <label for="queens-number">Run N-Queens Task</label>
            <input type="number" id="queens-number" placeholder="Enter N-Queens number (default: 8)">
            <button onclick="runNQueensTask()">Run N-Queens Task</button>
        </div>
        <div class="task-group">
            <label>Run Long Polling Task</label>
            <button onclick="runLongPollingTask()">Run Long Polling Task</button>
        </div>
        <div id="result"></div>
    </div>

    <script src="{% static '/js/polling_utils.js' %}"></script>
    <script>
        const resultDiv = document.getElementById('result');

        function runPrintMessageTask() {
            const delay = document.getElementById('delay').value || 5;

            const url = '/api/run_simple_task/';
            const parameters = {
                method: 'POST',
                data: { delay: delay },
                headers: {
                    'Content-Type': 'application/json'
                },
                handleSuccess: (result) => {
                    console.log(result);
                    setTimeout(() => {
                        resultDiv.textContent = `The result of task (${result?.task_id}) is ${result?.result}`;
                    });
                },
                finishPolling: (result) => {
                    console.log(result);
                    console.log('finish polling');
                },
                handleError: (result) => {
                    console.log(result);
                    setTimeout(() => {
                        resultDiv.textContent = `Task (${result?.task_id}) finished with error.`;
                    });
                },
                handleMaximumRetriesError: (result) => {
                    console.log(result);
                    resultDiv.textContent = `Maximum retries error`;
                },
            };

            PollingUtilities.pollingFetch({
                parameters,
                taskURL: url,
                checkForResultsURL: '/api/check_task_result',
                maxPollingRetries: 100, // Adjust as needed
                initialPollingTimeout: 1000, // Adjust as needed
                taskURLSuccessCallback: (task) => {
                    console.log(task);
                    resultDiv.textContent = `Task (${task?.task_id}) is Running`;
                },
                startSpinnerCallback: () => {
                    resultDiv.textContent = 'Starting Task...';
                },
                stopSpinnerCallback: () => {
                    resultDiv.textContent = 'finish';
                },
            });
        }

        function runNQueensTask() {
            const queensNumber = document.getElementById('queens-number').value || 10;

            const url = '/api/run_celery_task/';
            const parameters = {
                method: 'POST',
                data: { n: queensNumber },
                headers: {
                    'Content-Type': 'application/json'
                },
                handleSuccess: (result) => {
                    console.log(result);
                    setTimeout(() => {
                        resultDiv.innerHTML = `The result of task (${result?.task_id}) is <br/> ${
                            JSON.parse(result?.result).join('<br/>')
                        }`;
                    });
                },
                finishPolling: (result) => {
                    console.log(result);
                    console.log('finish polling');
                },
                handleError: (result) => {
                    console.log(result);
                    setTimeout(() => {
                        resultDiv.textContent = `Task (${result?.task_id}) finished with error.`;
                    });
                },
                handleMaximumRetriesError: (result) => {
                    console.log(result);
                    resultDiv.textContent = `Maximum retries error`;
                },
            };

            PollingUtilities.pollingFetch({
                parameters,
                taskURL: url,
                checkForResultsURL: '/api/check_task_result',
                maxPollingRetries: 100, // Adjust as needed
                initialPollingTimeout: 1000, // Adjust as needed
                taskURLSuccessCallback: (task) => {
                    console.log(task);
                    resultDiv.textContent = `Task (${task?.task_id}) is Running`;
                },
                startSpinnerCallback: () => {
                    resultDiv.textContent = 'Starting Task...';
                },
                stopSpinnerCallback: () => {
                    resultDiv.textContent = 'finish';
                },
            });
        }

        function runLongPollingTask() {
            resultDiv.textContent = `Long polling is running...`;
            fetch('/api/long_polling/', {
                method: 'POST',
            }).then((response) => {
                return response.json();
            }).then(
                (result) => resultDiv.textContent = `The result of long polling is: ${JSON.stringify(result)}`
            ).catch(error => {
                resultDiv.textContent = `Error: ${error}`;
            });
        }
    </script>
</body>
</html>
